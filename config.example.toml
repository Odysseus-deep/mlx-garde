# Memory kept free on top of what a job needs, in GB.
margin_gb = 6
# A model takes about its size on disk × this factor once loaded.
model_factor = 1.3
# A run that writes more than this to swap is flagged, in MB.
swap_alert_mb = 256
# Lock, queue and journal.
# state_dir = "~/.cache/mlx-garde"

# Local servers asked for the models they hold. Listing servers replaces the defaults.
[[servers]]
kind = "omlx"
url = "http://127.0.0.1:8000"
key_file = "/Users/you/.omlx/settings.json"   # auth.api_key is read from it
enabled = true

[[servers]]
kind = "ollama"
url = "http://127.0.0.1:11434"
enabled = true

[[servers]]
kind = "lmstudio"
url = "http://127.0.0.1:1234"
enabled = false   # port 1234 is often taken by something else
